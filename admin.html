<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zovalux — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15120D; --mist:#F6F1E7; --mist-2:#EDE4D2; --metal:#8A7C64;
  --gold:#D4AF37; --gold-dark:#B08A2B; --card:#FFFFFF; --line: rgba(21,18,13,.12);
  --danger:#C24A47; --ok:#3F8F5F;
  --serif:"Fraunces",serif; --sans:"Inter",sans-serif; --mono:"Space Grotesk",sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{ font-family:var(--sans); background:var(--mist); color:var(--ink); }
h1,h2{ font-family:var(--serif); font-weight:600; }
.wrap{ max-width:1000px; margin:0 auto; padding:32px 20px 80px; }

/* Login */
#loginView{
  max-width:360px; margin:14vh auto; text-align:center;
}
#loginView h1{ font-size:24px; margin-bottom:6px; }
#loginView p{ color:var(--metal); font-size:14px; margin-bottom:24px; }
input, select, textarea{
  width:100%; font-family:var(--sans); font-size:14px;
  background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px;
}
button{
  font-family:var(--sans); cursor:pointer; border:none; border-radius:10px;
  padding:12px 18px; font-weight:600; font-size:14px;
}
.btn-gold{ background:var(--gold); color:var(--ink); }
.btn-gold:hover{ background:var(--gold-dark); }
.btn-dark{ background:var(--ink); color:#fff; }
.btn-outline{ background:transparent; border:1px solid var(--line); color:var(--ink); }

/* Layout admin */
#adminView{ display:none; }
header.admin-head{
  display:flex; justify-content:space-between; align-items:center;
  margin-bottom:28px;
}
header.admin-head h1{ font-size:21px; }
.tabs{ display:flex; gap:8px; margin-bottom:24px; flex-wrap:wrap; }
.tab-btn{
  background:var(--card); border:1px solid var(--line); color:var(--ink);
  padding:9px 16px; border-radius:100px; font-size:13.5px;
}
.tab-btn.active{ background:var(--ink); color:#fff; border-color:var(--ink); }
.panel{ display:none; }
.panel.active{ display:block; }

/* Réservations */
.booking-row{
  background:var(--card); border:1px solid var(--line); border-radius:14px;
  padding:16px 18px; margin-bottom:10px;
  display:flex; justify-content:space-between; align-items:center; gap:14px; flex-wrap:wrap;
}
.booking-info b{ font-family:var(--mono); }
.booking-info .sub{ color:var(--metal); font-size:13px; margin-top:2px; }
.status-pill{
  font-family:var(--mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
  padding:4px 10px; border-radius:100px; white-space:nowrap;
}
.status-pending{ background:rgba(212,175,55,.15); color:var(--gold-dark); }
.status-confirmed{ background:rgba(63,143,95,.15); color:var(--ok); }
.status-rejected{ background:rgba(194,74,71,.15); color:var(--danger); }
.booking-actions{ display:flex; gap:8px; }
.booking-actions button{ padding:8px 14px; font-size:12.5px; }

/* Album */
.upload-card{
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px; margin-bottom:20px;
}
.upload-row{ display:flex; gap:10px; margin-bottom:10px; flex-wrap:wrap; }
.upload-row > *{ flex:1; min-width:140px; }
.gallery-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:14px; }
.gallery-item{ background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
.gallery-item img{ width:100%; height:120px; object-fit:cover; display:block; }
.gallery-item .meta{ padding:10px; }
.gallery-item .meta small{ color:var(--metal); }
.gallery-item .del{ width:100%; background:transparent; color:var(--danger); font-size:12px; padding:8px; border-top:1px solid var(--line); }

/* Stats */
.stat-cards{ display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:14px; margin-bottom:24px; }
.stat-card{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; }
.stat-card b{ display:block; font-family:var(--mono); font-size:28px; }
.stat-card span{ font-size:12.5px; color:var(--metal); }
.visit-list{ font-size:13.5px; }
.visit-list div{ display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--line); }

.empty{ color:var(--metal); font-size:14px; padding:20px 0; text-align:center; }
.error-msg{ color:var(--danger); font-size:13px; margin-top:10px; }
</style>
</head>
<body>

<div id="loginView">
  <h1>Zovalux — Admin</h1>
  <p>Accès réservé. Entrez le mot de passe admin.</p>
  <input type="password" id="secretInput" placeholder="Mot de passe admin" style="margin-bottom:10px;">
  <button class="btn-gold" style="width:100%;" onclick="login()">Se connecter</button>
  <p class="error-msg" id="loginError" style="display:none;">Mot de passe incorrect.</p>
</div>

<div id="adminView">
  <div class="wrap">
    <header class="admin-head">
      <h1>Zovalux — Admin</h1>
      <button class="btn-outline" onclick="logout()">Déconnexion</button>
    </header>

    <div class="tabs">
      <button class="tab-btn active" data-tab="bookings">Réservations</button>
      <button class="tab-btn" data-tab="gallery">Album avant/après</button>
      <button class="tab-btn" data-tab="stats">Statistiques</button>
    </div>

    <!-- RESERVATIONS -->
    <div class="panel active" id="panel-bookings">
      <div id="bookingsList"></div>
    </div>

    <!-- ALBUM -->
    <div class="panel" id="panel-gallery">
      <div class="upload-card">
        <div class="upload-row">
          <input type="file" id="galleryFile" accept="image/*">
          <select id="galleryType">
            <option value="before">Avant (sale)</option>
            <option value="after">Après (propre)</option>
          </select>
        </div>
        <div class="upload-row">
          <input type="text" id="galleryCaption" placeholder="Légende (optionnel)">
          <button class="btn-gold" onclick="uploadPhoto()">Ajouter la photo</button>
        </div>
        <p class="error-msg" id="galleryError" style="display:none;"></p>
      </div>
      <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <!-- STATS -->
    <div class="panel" id="panel-stats">
      <div class="stat-cards" id="statCards"></div>
      <h2 style="font-size:16px; margin-bottom:10px;">Visites par jour (30 derniers jours avec activité)</h2>
      <div class="visit-list" id="visitList"></div>
    </div>
  </div>
</div>

<script>
// ⚠️ Remplace par l'URL de ton API Render une fois déployée
const API_BASE = "https://back-zovalux-ir0y.onrender.com";

let ADMIN_SECRET = localStorage.getItem('zovalux_admin_secret') || null;

function apiHeaders(){
  return { 'Content-Type': 'application/json', 'x-admin-secret': ADMIN_SECRET };
}

async function login(){
  const secret = document.getElementById('secretInput').value;
  const errorEl = document.getElementById('loginError');
  errorEl.style.display = 'none';
  let res;
  try{
    res = await fetch(`${API_BASE}/api/admin/login`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ secret })
    });
  }catch(networkErr){
    errorEl.textContent = "Impossible de contacter le serveur. Vérifie l'URL de l'API (variable API_BASE) et que ton service Render est bien déployé.";
    errorEl.style.display = 'block';
    return;
  }
  if(res.status === 401){
    errorEl.textContent = 'Mot de passe incorrect.';
    errorEl.style.display = 'block';
    return;
  }
  if(!res.ok){
    errorEl.textContent = `Erreur serveur (${res.status}). Vérifie la configuration Render.`;
    errorEl.style.display = 'block';
    return;
  }
  ADMIN_SECRET = secret;
  localStorage.setItem('zovalux_admin_secret', secret);
  showAdmin();
}
function logout(){
  localStorage.removeItem('zovalux_admin_secret');
  ADMIN_SECRET = null;
  document.getElementById('adminView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
}
function showAdmin(){
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('adminView').style.display = 'block';
  loadBookings(); loadGallery(); loadStats();
}
if(ADMIN_SECRET) showAdmin();

// Tabs
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
  });
});

// ---------- Réservations ----------
async function loadBookings(){
  const list = document.getElementById('bookingsList');
  list.innerHTML = '<p class="empty">Chargement...</p>';
  try{
    const res = await fetch(`${API_BASE}/api/admin/bookings`, { headers: apiHeaders() });
    const data = await res.json();
    if(!data.bookings || !data.bookings.length){
      list.innerHTML = '<p class="empty">Aucune réservation pour le moment.</p>';
      return;
    }
    list.innerHTML = data.bookings.map(b => `
      <div class="booking-row">
        <div class="booking-info">
          <b>${b.date}</b> — ${b.name} <span class="status-pill status-${b.status}">${b.status}</span>
          <div class="sub">${b.email} · ${b.phone} · ${b.service || ''} ${b.vehicule ? '· ' + b.vehicule : ''}</div>
          ${b.address ? `<div class="sub">${b.address}</div>` : ''}
        </div>
        <div class="booking-actions">
          ${b.status === 'pending' ? `
            <button class="btn-gold" onclick="actOnBooking('${b._id}','confirm')">Confirmer</button>
            <button class="btn-outline" onclick="actOnBooking('${b._id}','reject')">Refuser</button>
          ` : ''}
        </div>
      </div>
    `).join('');
  }catch(err){
    list.innerHTML = '<p class="empty">Erreur de chargement.</p>';
  }
}
async function actOnBooking(id, action){
  await fetch(`${API_BASE}/api/admin/bookings/${id}/${action}`, { method: 'POST', headers: apiHeaders() });
  loadBookings();
}

// ---------- Album ----------
function resizeImage(file, maxWidth){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale;
        canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
async function uploadPhoto(){
  const fileInput = document.getElementById('galleryFile');
  const errorEl = document.getElementById('galleryError');
  errorEl.style.display = 'none';
  if(!fileInput.files[0]){
    errorEl.textContent = 'Choisis une photo.';
    errorEl.style.display = 'block';
    return;
  }
  try{
    const imageData = await resizeImage(fileInput.files[0], 1000);
    const res = await fetch(`${API_BASE}/api/admin/gallery`, {
      method: 'POST', headers: apiHeaders(),
      body: JSON.stringify({
        imageData,
        caption: document.getElementById('galleryCaption').value,
        type: document.getElementById('galleryType').value
      })
    });
    if(!res.ok) throw new Error();
    fileInput.value = '';
    document.getElementById('galleryCaption').value = '';
    loadGallery();
  }catch(err){
    errorEl.textContent = "Échec de l'envoi.";
    errorEl.style.display = 'block';
  }
}
async function loadGallery(){
  const grid = document.getElementById('galleryGrid');
  try{
    const res = await fetch(`${API_BASE}/api/gallery`);
    const data = await res.json();
    if(!data.items || !data.items.length){
      grid.innerHTML = '<p class="empty">Aucune photo pour le moment.</p>';
      return;
    }
    grid.innerHTML = data.items.map(item => `
      <div class="gallery-item">
        <img src="${item.imageData}" alt="${item.caption || ''}">
        <div class="meta"><small>${item.type === 'before' ? 'Avant' : 'Après'}${item.caption ? ' — ' + item.caption : ''}</small></div>
        <button class="del" onclick="deletePhoto('${item._id}')">Supprimer</button>
      </div>
    `).join('');
  }catch(err){
    grid.innerHTML = '<p class="empty">Erreur de chargement.</p>';
  }
}
async function deletePhoto(id){
  await fetch(`${API_BASE}/api/admin/gallery/${id}`, { method: 'DELETE', headers: apiHeaders() });
  loadGallery();
}

// ---------- Stats ----------
async function loadStats(){
  try{
    const res = await fetch(`${API_BASE}/api/admin/stats`, { headers: apiHeaders() });
    const data = await res.json();
    document.getElementById('statCards').innerHTML = `
      <div class="stat-card"><b>${data.total || 0}</b><span>Visites (30j)</span></div>
      <div class="stat-card"><b>${data.bookingsTotal || 0}</b><span>Réservations totales</span></div>
      <div class="stat-card"><b>${data.bookingsPending || 0}</b><span>En attente</span></div>
    `;
    const list = document.getElementById('visitList');
    if(!data.visits || !data.visits.length){
      list.innerHTML = '<p class="empty">Pas encore de données de visite.</p>';
    } else {
      list.innerHTML = data.visits.map(v => `<div><span>${v.date}</span><b>${v.count}</b></div>`).join('');
    }
  }catch(err){
    document.getElementById('statCards').innerHTML = '<p class="empty">Erreur de chargement.</p>';
  }
}
</script>
</body>
</html>
